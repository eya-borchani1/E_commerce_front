<h2>CRUD Utilisateurs</h2>

<!-- Formulaire -->
<form [formGroup]="userForm" (ngSubmit)="editMode ? updateUser() : addUser()">
  <input type="text" formControlName="name" placeholder="Nom" />
  <input type="email" formControlName="email" placeholder="Email" />
  <input type="password" formControlName="password" placeholder="Mot de passe" />

  <button type="submit" [disabled]="userForm.invalid">
    {{ editMode ? 'Mettre à jour' : 'Ajouter' }}
  </button>
  <button *ngIf="editMode" type="button" (click)="cancelEdit()">Annuler</button>
</form>

<hr>

<table border="1" cellpadding="5" cellspacing="0">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Mot de passe</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.password }}</td>
      <td>
        <button (click)="editUser(user)">Éditer</button>
        <button (click)="deleteUser(user.id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
